name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - name: Run backend tests
        working-directory: devops-assistant-backend
        run: mvn -B test

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: devops-assistant-frontend/package-lock.json
      - name: Install dependencies
        working-directory: devops-assistant-frontend
        run: npm ci
      - name: Typecheck
        working-directory: devops-assistant-frontend
        run: npx tsc --noEmit
      - name: Build
        working-directory: devops-assistant-frontend
        run: npm run build -- --no-lint
