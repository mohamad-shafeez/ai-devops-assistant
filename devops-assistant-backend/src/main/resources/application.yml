server:
  port: 8080

spring:
  application:
    name: devops-assistant-backend
  datasource:
    url: jdbc:postgresql://localhost:5432/devops_db
    username: devops_user
    password: devops_password
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

gemini:
  api:
    key: ${GEMINI_API_KEY:}
    url: https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent